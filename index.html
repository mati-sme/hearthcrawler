<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Hearthcrawler 2.0</title>
<link rel="stylesheet" href="css/hud.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pad"></div>
<div id="joy"><i id="joyknob"></i></div>
<div id="hud">
  <div id="goal" class="pnl"><div class="in"><div class="lbl"><span id="goal-n">GOAL 01</span><span id="goal-cnt"></span></div><div id="goal-t">—</div><div class="bar"><i id="goal-bar"></i></div><div id="goal-r"></div></div></div>
  <canvas id="compass" width="360" height="34"></canvas>
  <div id="clock" class="pnl"><div class="in"><span id="clk-ic"></span><span id="clk-day">DAY 1</span><span id="clk-time">06:00</span></div></div>
  <button id="b-menu" class="btn sq" aria-label="Menu"></button>
  <div id="zone"></div>
  <div id="notices"></div>
  <div id="cross"><i></i><div id="cross-ic"></div><div id="cross-lbl"></div></div>
  <div id="stats">
    <div class="xp"><span id="lv">LV 1</span><div class="bar"><i id="xp-bar"></i></div></div>
    <div class="row" id="r-hp"></div><div class="row" id="r-food"></div><div class="row" id="r-stam"></div>
  </div>
  <div id="hotbar"></div>
  <div id="boss" class="pnl hidden"><div class="in"><span id="boss-n">WARLORD</span><div class="bar"><i id="boss-bar"></i></div></div></div>
  <div id="buildbar" class="hidden"><div class="bb-top"><div id="bb-info"></div><div class="bb-nav"><button id="b-slotprev" class="btn sq sm">&lsaquo;</button><button id="b-slotnext" class="btn sq sm">&rsaquo;</button><button id="b-cancel" class="btn sq sm"></button></div></div><div id="bb-types"></div></div>
  <button id="b-jump" class="btn act" aria-label="Jump"></button>
  <button id="b-interact" class="btn act" aria-label="Interact"><span id="int-lbl">USE</span></button>
  <button id="b-build" class="btn act" aria-label="Build"><span id="build-lbl">BUILD</span></button>
  <button id="b-attack" class="btn act big" aria-label="Attack"><span id="atk-lbl">GATHER</span></button>
  <div id="popups"></div>
  <div id="hurt"></div>
  <div id="fade"></div>
</div>
<div id="panel" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="rotate"><div class="rot-in"><svg class="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="1.5"/><path d="M11 18.5h2"/></svg><b>ROTATE YOUR PHONE</b><span>Hearthcrawler is played in landscape</span></div></div>
<div id="dbg" class="hidden"></div>
<div id="loading"><div class="rot-in"><b>HEARTHCRAWLER</b><span>waking the Shellback…</span></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
